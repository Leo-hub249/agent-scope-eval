# Experiment configuration. Model IDs live here only (never hardcoded).
# Every value below is copied into each run's meta.json.

agent:
  model: claude-sonnet-5-5          # primary agent model
  comparison_models:                # only if the budget allows (Phase 6)
    - claude-opus-5-5
    - claude-haiku-5-5
  effort: high                      # same explicit effort for every agent model (defaults differ per model)
  thinking_display: summarized      # visibility only (log readability); thinking is billed the same; never shown to the monitor
  max_tokens_per_response: 16000

limits:
  command_timeout_s: 60             # per bash command inside the sandbox; on timeout the shell session is restarted
  max_tool_output_chars: 10000      # longer command output is cut (head + tail kept) before the model sees it
  max_turns: 30                     # model requests per run
  max_tokens_per_run: 400000        # cumulative input (incl. cache reads/writes) + output tokens over all requests of a run

monitor:
  model: claude-haiku-5-5
  effort: low

sampling:
  samples_per_task: 5               # the API is not seedable: variance comes from repeated samples
  task_order_seed: 1234             # our own RNG only

budget:                             # ledger: runs/ledger.jsonl (D40, D49)
  max_total_usd: 62.00              # all namespaces together (dry run + pilot $0.17, calibration, experiment)
  default_max_runs: 1               # any namespace not listed below
  namespaces:
    dry-run:     {max_runs: 1}
    pilot:       {max_runs: 5}
    calibration: {max_runs: 14, max_usd: 1.50}     # approved 2026-11-03: about $1
    experiment:  {max_runs: 225, max_usd: 60.00}   # approved 2026-11-03: hard cap $60, the runner stops at the cap

calibration:                        # namespace "calibration", sample 0 each (D49)
  - {task: T06, model: claude-sonnet-5-5}
  - {task: T07, model: claude-sonnet-5-5}
  - {task: T08, model: claude-sonnet-5-5}
  - {task: T09, model: claude-sonnet-5-5}
  - {task: T10, model: claude-sonnet-5-5}
  - {task: T11, model: claude-sonnet-5-5}
  - {task: T12, model: claude-sonnet-5-5}
  - {task: T13, model: claude-sonnet-5-5}
  - {task: T14, model: claude-sonnet-5-5}
  - {task: T15, model: claude-sonnet-5-5}
  - {task: T02, model: claude-opus-5-5}       # token profiles of the other two models,
  - {task: T12, model: claude-opus-5-5}       # on one old and one new task
  - {task: T02, model: claude-haiku-5-5}
  - {task: T12, model: claude-haiku-5-5}

cache:
  dir: cache                        # gitignored; key = request + sample index + namespace
