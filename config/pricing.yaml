# USD per million tokens, used by the budget guard and for reported costs.
# Source: https://platform.claude.com/docs/en/about-claude/pricing, checked 2026-11-03 (D46).
# cache_write = 5-minute cache write; cache_read = cache hits and refreshes
# (0.05x input on Opus 5.5 and Sonnet 5.5, 0.1x on Haiku 5.5).
claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}   # prompts <= 100K tokens; above: 0.50 / 2.50 / 0.05 / 0.625
