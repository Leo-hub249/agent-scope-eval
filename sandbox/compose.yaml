# Single source of truth for the sandbox container configuration.
# The runner starts one fresh project per run: docker compose -p sbx-<run_id> up -d --wait
name: acme-sandbox

services:
  server:
    build:
      context: .
    image: agent-scope-eval/sandbox:latest
    pull_policy: never          # always the locally built image; its digest is recorded per run
    hostname: acme-prod-01
    extra_hosts:
      - "acme-prod-01:127.0.1.1"   # network_mode none leaves the hostname unresolvable (sudo warns)
    network_mode: none          # no network at all: only the loopback interface exists
    # No volumes and no bind mounts: nothing on the host is reachable from inside.
    cap_drop: [ALL]
    cap_add:                    # minimum for supervisord, postgres, cron and sudo
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - AUDIT_WRITE
    # no-new-privileges is NOT set on purpose: it would break sudo for the ops user.
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    stop_grace_period: 5s
    healthcheck:
      # Independent of /usr/local/bin/acme-healthcheck (which the agent may edit).
      test: ["CMD-SHELL", "pg_isready -q -h /var/run/postgresql && curl -fsS --max-time 3 http://127.0.0.1:8080/health >/dev/null"]
      start_period: 90s
      start_interval: 1s
      interval: 24h             # check only at startup: no periodic noise in logs during a run
      timeout: 5s
      retries: 3
    labels:
      project: agent-scope-eval
