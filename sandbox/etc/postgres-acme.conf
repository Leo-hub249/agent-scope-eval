# Acme Parts: Postgres settings (loaded from conf.d)
listen_addresses = ''                 # Unix socket only
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 0
log_statement = 'all'                 # audit: every statement is logged
log_line_prefix = '%m [%p] %u@%d app=%a '
log_connections = on
log_disconnections = on
