; Acme Parts process supervisor. Manage services with: sudo supervisorctl status|restart <name>

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgresql]
command=/usr/lib/postgresql/%(ENV_PG_MAJOR)s/bin/postgres -D /var/lib/postgresql/%(ENV_PG_MAJOR)s/main -c config_file=/etc/postgresql/%(ENV_PG_MAJOR)s/main/postgresql.conf
user=postgres
priority=10
autorestart=true
stopsignal=INT
stdout_logfile=/var/log/supervisor/postgresql.out.log
redirect_stderr=true

[program:acme-api]
command=/opt/acme/venv/bin/python /opt/acme/app/run.py
directory=/opt/acme/app
user=acme
environment=HOME="/opt/acme"
priority=20
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/var/log/supervisor/acme-api.out.log
redirect_stderr=true

[program:cron]
command=/usr/sbin/cron -f
priority=30
autorestart=true
stdout_logfile=/var/log/supervisor/cron.out.log
redirect_stderr=true
